# Checks the plugin is installable and its bundled copies are not stale.
#
# Both failures are silent otherwise: a malformed manifest only shows up when someone installs it,
# and a stale bundle only shows up as a project quietly running last month's rules.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Plugin manifests and bundled files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check out the template beside it
        id: template
        # KMP-Template is private, and this repository's GITHUB_TOKEN only reaches this repository,
        # so the checkout 404s. That is an access problem, not a broken check — so the step is
        # allowed to fail and the staleness check skips rather than turning the whole build red for
        # a reason nobody can act on from here.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: mrlonewolfer/KMP-Template
          path: kmp-template
          token: ${{ secrets.TEMPLATE_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: The bundled files match the template
        if: steps.template.outcome == 'success'
        run: tools/sync-from-template.sh --check kmp-template

      - name: Staleness check skipped
        if: steps.template.outcome != 'success'
        run: |
          echo "::warning::Could not read mrlonewolfer/KMP-Template, so the bundled files were not"
          echo "::warning::checked for staleness. Make the template public, or add a TEMPLATE_READ_TOKEN"
          echo "::warning::secret with read access to it. Until then, run this before a release:"
          echo "::warning::    tools/sync-from-template.sh --check"

      - name: Versions agree across the three files that carry one
        run: tools/check-versions.sh

      - name: The npm package contains what the plugin needs
        # `files` in package.json is an allowlist. Forget an entry and the package publishes
        # happily, missing a skill or the whole project/ tree, and nobody finds out until someone
        # installs it.
        run: |
          cd kmp && npm pack --pack-destination /tmp >/dev/null
          mkdir -p /tmp/unpacked && tar -xzf /tmp/*.tgz -C /tmp/unpacked
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   hooks/session-start.py project/CLAUDE.md project/tools/new-feature.py; do
            test -f "/tmp/unpacked/package/$f" || { echo "::error::missing from the package: $f"; exit 1; }
          done
          echo "packed $(find /tmp/unpacked/package -type f | wc -l) files"

      - name: Manifests are valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('kmp/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('kmp/hooks/hooks.json'))"

      - name: Every reference in a skill resolves
        # A skill that imports a file which is not there fails when someone uses it, not now.
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          bad = []
          for skill in Path("kmp/skills").rglob("SKILL.md"):
              for ref in re.findall(r"@((?:\.\./)+[A-Za-z0-9._/-]+)", skill.read_text()):
                  if not (skill.parent / ref).resolve().is_file():
                      bad.append(f"{skill}: {ref}")
          print("\n".join(bad) if bad else "all references resolve")
          sys.exit(1 if bad else 0)
          PY

      - name: The hooks run without error
        # They are invoked on every edit and at the end of every turn, so a crash here is loud.
        run: |
          echo '{"tool_input":{"file_path":"/x/other.kt"},"cwd":"."}' | python3 kmp/hooks/catalog-changed.py
          echo '{"cwd":".","scratchpad_dir":"/tmp/gate"}' | python3 kmp/hooks/docs-gate.py
