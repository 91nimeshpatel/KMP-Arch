# Checks the bundle is current and that what it ships actually works where it lands.
#
# Both failures are quiet otherwise: a stale bundle ships last month's rules to every project, and
# a skill that points at a document the bundle does not carry fails for whoever follows it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Bundle and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out the template beside it
        id: template
        # The template is private and this repository's GITHUB_TOKEN only reaches this repository,
        # so the checkout 404s. That is an access problem, not a broken check, so the staleness
        # check skips rather than turning the build red for something nobody here can act on.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: 91nimeshpatel/KMP-Template
          path: kmp-template
          token: ${{ secrets.TEMPLATE_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: The bundle matches the template
        if: steps.template.outcome == 'success'
        run: tools/sync-from-template.sh --check kmp-template

      - name: Staleness check skipped
        if: steps.template.outcome != 'success'
        run: |
          echo "::warning::Could not read 91nimeshpatel/KMP-Template, so the bundle was not checked"
          echo "::warning::for staleness. Make it public, or add a TEMPLATE_READ_TOKEN secret."

      - name: No unresolved conflict markers
        # One reached a public README: a `git stash pop` during a recovery left conflict markers in
        # it, they were committed, and nobody noticed until a reader did. A grep is cheaper than
        # that.
        run: |
          if grep -rn '^<<<<<<< \|^>>>>>>> \|^=======$' --exclude-dir=.git --exclude-dir=build .; then
            echo "::error::Unresolved merge conflict markers"
            exit 1
          fi
          echo "no conflict markers"

      - name: The README agrees with the repository
        run: python3 tools/check-readme.py

      - name: Every document a skill points at is shipped
        run: python3 tools/check-references.py

      - name: The plugin builds and passes Gradle's own validation
        run: cd gradle-plugin && ./gradlew build

      - name: A real project can adopt the standards
        # The only check that proves the thing works: publish locally, apply it to an empty project,
        # and count what lands. Everything else tests the parts.
        #
        # It runs with the configuration cache on and problems=fail, because the plugin now tells
        # the Portal it supports the configuration cache and Isolated Projects. A declaration that
        # nothing re-checks is how 1.0.0 went out claiming the opposite of what it shipped.
        run: |
          cd gradle-plugin && ./gradlew publishToMavenLocal -q && cd ..
          mkdir -p /tmp/adopt && cd /tmp/adopt
          cp "$GITHUB_WORKSPACE/gradle-plugin/gradlew" .
          cp -R "$GITHUB_WORKSPACE/gradle-plugin/gradle" .
          VERSION=$(cat "$GITHUB_WORKSPACE/VERSION")
          cat > settings.gradle.kts <<EOF
          pluginManagement { repositories { mavenLocal(); gradlePluginPortal() } }
          plugins { id("io.github.91nimeshpatel.kmp.arch") version "$VERSION" }
          rootProject.name = "adopt"
          include(":app", ":core-a")
          EOF
          mkdir -p app core-a
          echo 'plugins { base }' > app/build.gradle.kts
          echo 'plugins { base }' > core-a/build.gradle.kts
          cat > gradle.properties <<'EOF'
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=fail
          EOF
          ./gradlew adoptArch --apply --isolated-projects
          test -f CLAUDE.md
          test -f .claude/settings.json
          test -f .claude/skills/add-a-feature/SKILL.md
          test -f docs/ADDING_A_FEATURE.md
          test -f architecture-tests/src/test/kotlin/LayerDependencyTest.kt
          test -x tools/new-feature.py
          # Counts only what adoptArch wrote, so the number printed here is the same number the
          # task reports. Counting the scaffolding too would inflate it by three and quietly make
          # this line disagree with the tool it is checking.
          echo "adopted $(find . -type f \
            -not -path './gradle/*' -not -path './.gradle/*' \
            -not -path './app/*' -not -path './core-a/*' \
            -not -name gradlew -not -name settings.gradle.kts -not -name gradle.properties \
            | wc -l) files"

      - name: The declared feature compatibility is true and is in the artifact
        # Two separate claims, so two separate checks: that a second run really reuses the entry,
        # and that the descriptor the Portal reads actually says so. 1.0.0 shipped UNDECLARED while
        # a comment in the build script claimed it was declared.
        run: |
          cd /tmp/adopt
          ./gradlew adoptArch --apply --isolated-projects 2>&1 | tee rerun.log
          grep -q 'Configuration cache entry reused' rerun.log \
            || { echo "::error::The entry was not reused, so the declaration is false"; exit 1; }
          VERSION=$(cat "$GITHUB_WORKSPACE/VERSION")
          JAR="$HOME/.m2/repository/io/github/91nimeshpatel/kmp-arch-gradle-plugin/$VERSION/kmp-arch-gradle-plugin-$VERSION.jar"
          DESC=$(unzip -p "$JAR" 'META-INF/gradle-plugins/io.github.91nimeshpatel.kmp.arch.properties')
          echo "$DESC"
          for feature in configuration-cache isolated-projects; do
            echo "$DESC" | grep -q "compatibility.feature.$feature=DECLARED_SUPPORTED" \
              || { echo "::error::$feature is not declared in the published descriptor"; exit 1; }
          done
          echo "both features declared and proven"
