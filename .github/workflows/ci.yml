# Checks the plugin is installable and its bundled copies are not stale.
#
# Both failures are silent otherwise: a malformed manifest only shows up when someone installs it,
# and a stale bundle only shows up as a project quietly running last month's rules.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Plugin manifests and bundled files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check out the template beside it
        uses: actions/checkout@v7
        with:
          repository: mrlonewolfer/KMP-Template
          path: kmp-template

      - name: The bundled files match the template
        run: tools/sync-from-template.sh --check kmp-template

      - name: Manifests are valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('kmp/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('kmp/hooks/hooks.json'))"

      - name: Every reference in a skill resolves
        # A skill that imports a file which is not there fails when someone uses it, not now.
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          bad = []
          for skill in Path("kmp/skills").rglob("SKILL.md"):
              for ref in re.findall(r"@((?:\.\./)+[A-Za-z0-9._/-]+)", skill.read_text()):
                  if not (skill.parent / ref).resolve().is_file():
                      bad.append(f"{skill}: {ref}")
          print("\n".join(bad) if bad else "all references resolve")
          sys.exit(1 if bad else 0)
          PY

      - name: The hooks run without error
        # They are invoked on every edit and at the end of every turn, so a crash here is loud.
        run: |
          echo '{"tool_input":{"file_path":"/x/other.kt"},"cwd":"."}' | python3 kmp/hooks/catalog-changed.py
          echo '{"cwd":".","scratchpad_dir":"/tmp/gate"}' | python3 kmp/hooks/docs-gate.py
