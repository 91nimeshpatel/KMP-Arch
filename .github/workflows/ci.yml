# Checks the bundle is current and that what it ships actually works where it lands.
#
# Both failures are quiet otherwise: a stale bundle ships last month's rules to every project, and
# a skill that points at a document the bundle does not carry fails for whoever follows it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Bundle and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out the template beside it
        id: template
        # The template is private and this repository's GITHUB_TOKEN only reaches this repository,
        # so the checkout 404s. That is an access problem, not a broken check, so the staleness
        # check skips rather than turning the build red for something nobody here can act on.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: mrlonewolfer/KMP-Template
          path: kmp-template
          token: ${{ secrets.TEMPLATE_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: The bundle matches the template
        if: steps.template.outcome == 'success'
        run: tools/sync-from-template.sh --check kmp-template

      - name: Staleness check skipped
        if: steps.template.outcome != 'success'
        run: |
          echo "::warning::Could not read mrlonewolfer/KMP-Template, so the bundle was not checked"
          echo "::warning::for staleness. Make it public, or add a TEMPLATE_READ_TOKEN secret."

      - name: Every document a skill points at is shipped
        run: python3 tools/check-references.py

      - name: The plugin builds and passes Gradle's own validation
        run: cd gradle-plugin && ./gradlew build

      - name: A real project can adopt the standards
        # The only check that proves the thing works: publish locally, apply it to an empty project,
        # and count what lands. Everything else tests the parts.
        run: |
          cd gradle-plugin && ./gradlew publishToMavenLocal -q && cd ..
          mkdir -p /tmp/adopt && cd /tmp/adopt
          cp "$GITHUB_WORKSPACE/gradle-plugin/gradlew" .
          cp -R "$GITHUB_WORKSPACE/gradle-plugin/gradle" .
          VERSION=$(cat "$GITHUB_WORKSPACE/VERSION")
          cat > settings.gradle.kts <<EOF
          pluginManagement { repositories { mavenLocal(); gradlePluginPortal() } }
          plugins { id("io.github.mrlonewolfer.kmp.arch") version "$VERSION" }
          rootProject.name = "adopt"
          EOF
          ./gradlew adoptArch --apply
          test -f CLAUDE.md
          test -f .claude/settings.json
          test -f .claude/skills/add-a-feature/SKILL.md
          test -f docs/ADDING_A_FEATURE.md
          test -f architecture-tests/src/test/kotlin/LayerDependencyTest.kt
          test -x tools/new-feature.py
          echo "adopted $(find . -type f -not -path './gradle/*' -not -path './.gradle/*' | wc -l) files"
