name: Set up the Kotlin Multiplatform build environment
description: >-
  JDK 17, the Android SDK with accepted licences, and the Gradle and Kotlin/Native caches. Shared by
  every job so the whole pipeline agrees on one toolchain (.claude/rules/dependencies.md).

inputs:
  cache-read-only:
    description: Only read the Gradle cache. True everywhere except main, to keep the cache small.
    required: false
    default: 'true'
  konan:
    description: >-
      Also cache ~/.konan, the Kotlin/Native toolchain and prebuilt dependencies. Only the macOS
      jobs compile for iOS, and the directory is large, so Linux jobs leave it off.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up the Android SDK
      uses: android-actions/setup-android@v4
      with:
        # AGP downloads the platform and build-tools it needs; platform-tools gives adb.
        packages: platform-tools
        log-accepted-android-sdk-licenses: 'false'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        add-job-summary: on-failure

    # Kotlin/Native downloads a compiler and prebuilt libraries on first use, which is several
    # minutes and hundreds of megabytes. The key is the Kotlin version, so it changes only on an
    # upgrade.
    - name: Cache the Kotlin/Native toolchain
      if: inputs.konan == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
